<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Psych</title>
    <meta name="description" content="The party game where a very curious app asks questions about you. Host on one device, everyone joins with a 4-digit code." />
    <meta name="theme-color" content="#fbf3e4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Psych" />
    <meta property="og:title" content="AI Psych" />
    <meta property="og:description" content="The party game where a very curious app asks questions about you." />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="assets/fonts/finger-paint.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="modulepreload" href="js/vendor/peer.js" />
  </head>
  <body data-mood="1">
    <div id="app">
      <noscript><p style="padding:24px;font-family:sans-serif">AI Psych needs JavaScript turned on.</p></noscript>
    </div>
    <script>
      // Firefox (desktop and Android) isn't supported: ask for Chrome or Safari instead, with a way
      // to copy the link — plain HTML, so it shows even where the game itself can't run.
      // (Firefox on iPhone is Safari inside, so it's fine.)
      (function () {
        var ua = navigator.userAgent;
        var ok = false;
        try { ok = sessionStorage.getItem('aipsych.tryFirefox') === '1'; } catch (e) {}
        if (!/Firefox\//.test(ua) || /FxiOS/.test(ua) || ok) return;
        window.__aipsychBlocked = true;
        var link = location.href.replace(/[<>"]/g, '');
        document.getElementById('app').innerHTML =
          '<div style="padding:28px 20px;font-family:sans-serif;max-width:460px;margin:8vh auto;text-align:center;color:#2d2a4a">' +
          '<div style="font-size:64px">🦊➡️🌐</div>' +
          '<h1 style="font-size:26px;margin:10px 0">Please open AI Psych in Chrome or Safari</h1>' +
          '<p style="font-size:18px;line-height:1.4">This game doesn\u2019t work well in Firefox yet. Copy the link and open it in <b>Chrome</b> (or <b>Safari</b> on iPhone/Mac).</p>' +
          '<p style="word-break:break-all;background:#f3eee2;padding:10px;border-radius:10px;font-size:14px" id="ff-link">' + link + '</p>' +
          '<button id="ff-copy" style="font-size:20px;padding:12px 22px;border-radius:14px;border:2.5px solid #2d2a4a;background:#ffc93c;cursor:pointer">Copy the link</button>' +
          '<p style="margin-top:26px"><a href="#" id="ff-anyway" style="color:#6b6790;font-size:15px">Try it in Firefox anyway</a></p></div>';
        document.getElementById('ff-copy').onclick = function () {
          var b = this;
          var done = function () { b.textContent = 'Copied! Now open Chrome and paste it'; };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, done);
          else done();
        };
        document.getElementById('ff-anyway').onclick = function (e) {
          e.preventDefault();
          try { sessionStorage.setItem('aipsych.tryFirefox', '1'); } catch (err) {}
          location.reload();
        };
      })();
    </script>
    <script>
      // Never a silent blank page: if the game hasn't started after a few seconds, say so and
      // show what went wrong (so it can be fixed), with a refresh button.
      (function () {
        var errs = [];
        addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) errs.push('failed to load ' + (t.src || t.href).split('/').slice(-2).join('/'));
          else errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        addEventListener('unhandledrejection', function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
        window.__bootErrors = errs;
        setTimeout(function () {
          var app = document.getElementById('app');
          if (!app || app.querySelector('.app') || window.__aipsychBlocked) return;
          var info = (navigator.userAgent + '\n' + (errs.join('\n') || 'no error reported')).replace(/[<>&]/g, '');
          app.innerHTML = '<div style="padding:24px;font-family:sans-serif;max-width:520px;margin:auto">' +
            '<h2>The game didn\u2019t start \uD83D\uDE15</h2><p>Try refreshing. If it keeps happening, update this browser or try another one, and send this to whoever set up the game:</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f3eee2;padding:10px;border-radius:8px">' + info + '</pre>' +
            '<button onclick="location.reload()" style="font-size:18px;padding:8px 18px">Refresh</button></div>';
        }, 7000);
      })();
    </script>
    <script nomodule>
      document.getElementById('app').innerHTML = '<p style="padding:24px;font-family:sans-serif">This browser is too old for AI Psych. Please update it (or open the link in Chrome, Firefox or Safari).</p>';
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
